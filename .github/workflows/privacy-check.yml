name: 隐私与密钥自检

# 说明：
# - 只做检查，不接管部署。网站仍由「git subtree push --prefix site origin gh-pages」发布。
# - 检查失败不会阻断推送（没配 required status check），只是提醒。
# - 目的：防止手机号 / 身份证 / 密钥再次被提交进仓库。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: 扫描手机号 / 身份证 / 密钥
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描当前文件（隐私号码）
        run: |
          echo "::group::手机号与身份证号扫描"
          FOUND=0
          # 手机号：11 位，排除小数与长数字串
          HITS=$(grep -rInP '(?<![0-9.])1[3-9][0-9]{9}(?![0-9])' \
            --include='*.html' --include='*.js' --include='*.mjs' --include='*.json' \
            --include='*.vue' --include='*.md' --include='*.css' --include='*.yml' \
            --include='*.yaml' --include='*.txt' \
            --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null || true)
          # 身份证：18 位
          IDHITS=$(grep -rInP '(?<![0-9])[0-9]{17}[0-9Xx](?![0-9A-Za-z])' \
            --include='*.html' --include='*.js' --include='*.json' --include='*.md' \
            --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo "::warning::发现疑似手机号"
            echo "$HITS" | sed -E 's/1[3-9][0-9]{9}/***号码***/g' | head -20
            FOUND=1
          else
            echo "✓ 无手机号命中"
          fi

          if [ -n "$IDHITS" ]; then
            echo "::warning::发现疑似身份证号"
            echo "$IDHITS" | sed -E 's/[0-9]{17}[0-9Xx]/***身份证***/g' | head -10
            FOUND=1
          else
            echo "✓ 无身份证命中"
          fi
          echo "::endgroup::"
          exit 0

      - name: 扫描当前文件（密钥）
        run: |
          echo "::group::令牌 / API Key / 私钥扫描"
          SEC=$(grep -rInE 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[baprs]-|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            --include='*.html' --include='*.js' --include='*.mjs' --include='*.json' \
            --include='*.yml' --include='*.yaml' --include='*.txt' --include='*.ps1' --include='*.sh' \
            --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null || true)

          if [ -n "$SEC" ]; then
            echo "::error::发现疑似密钥泄露！请立刻去对应平台撤销该密钥，删文件不等于安全"
            echo "$SEC" | cut -d: -f1,2 | head -20
            exit 1
          else
            echo "✓ 无密钥命中"
          fi
          echo "::endgroup::"

      - name: 提示历史残留（不阻断）
        continue-on-error: true
        run: |
          echo "::group::历史提交中的手机号（仅提示）"
          H=$(git log -p --all 2>/dev/null | grep -cE '1[3-9][0-9]{9}' || true)
          echo "历史中出现手机号的行数：$H"
          echo "说明：当前文件已干净；历史残留按项目决定保留（重写历史需 force push，风险更高）。"
          echo "::endgroup::"

      - name: 汇总
        run: |
          echo "检查完成。"
          echo "当前文件：隐私号码与密钥均已扫描。"
          echo "注意：本工作流不阻断推送，发现问题请手动修正后重新提交。"
