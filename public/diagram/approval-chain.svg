<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1240">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="380" height="1240" rx="16" fill="#F8F9FB"/>

  <!-- Title -->
  <text x="190" y="36" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#0D47A1">审批链 · 从学生到校长办公会</text>
  <line x1="40" y1="52" x2="340" y2="52" stroke="#E0E0E0" stroke-width="1"/>

  <!-- L1: Student -->
  <circle cx="50" cy="100" r="22" fill="#0D47A1"/>
  <text x="50" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="white">1</text>
  <rect x="82" y="82" width="260" height="36" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="92" y="104" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#0D47A1">🧑‍🎓 学生本人</text>
  <line x1="50" y1="122" x2="50" y2="148" stroke="#BBDEFB" stroke-width="2"/>

  <!-- L2 -->
  <circle cx="50" cy="170" r="22" fill="#1565C0"/>
  <text x="50" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="white">2</text>
  <rect x="82" y="152" width="260" height="36" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="92" y="174" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1565C0">👥 班级认定评议小组</text>
  <line x1="50" y1="192" x2="50" y2="218" stroke="#BBDEFB" stroke-width="2"/>

  <!-- L3 -->
  <circle cx="50" cy="240" r="22" fill="#1976D2"/>
  <text x="50" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="white">3</text>
  <rect x="82" y="222" width="260" height="36" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="92" y="244" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1976D2">👨‍🏫 辅导员/班主任</text>
  <line x1="50" y1="262" x2="50" y2="288" stroke="#BBDEFB" stroke-width="2"/>

  <!-- L4 -->
  <circle cx="50" cy="310" r="22" fill="#1E88E5"/>
  <text x="50" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="white">4</text>
  <rect x="82" y="292" width="260" height="36" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="92" y="314" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1E88E5">📊 二级学院学生干事</text>
  <line x1="50" y1="332" x2="50" y2="358" stroke="#BBDEFB" stroke-width="2"/>

  <!-- L5 -->
  <circle cx="50" cy="380" r="22" fill="#2196F3"/>
  <text x="50" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="white">5</text>
  <rect x="82" y="362" width="260" height="36" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="92" y="384" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#2196F3">👔 二级学院分管领导</text>
  <line x1="50" y1="402" x2="50" y2="428" stroke="#BBDEFB" stroke-width="2"/>

  <!-- L6 -->
  <circle cx="50" cy="450" r="22" fill="#42A5F5"/>
  <text x="50" y="455" text-anchor="middle" font-size="14" font-weight="700" fill="white">6</text>
  <rect x="82" y="432" width="260" height="36" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="92" y="454" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#42A5F5">🏛️ 学院资助工作领导小组</text>
  <line x1="50" y1="472" x2="50" y2="498" stroke="#FFE0B2" stroke-width="2"/>

  <!-- Divider: school-level -->
  <rect x="20" y="510" width="340" height="28" rx="8" fill="#FFF8E1"/>
  <text x="190" y="529" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#F59E0B">———— 校级以上审批 ————</text>

  <!-- L7 -->
  <circle cx="50" cy="580" r="22" fill="#F59E0B"/>
  <text x="50" y="585" text-anchor="middle" font-size="14" font-weight="700" fill="white">7</text>
  <rect x="82" y="562" width="260" height="36" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="92" y="584" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#F59E0B">🏢 学生资助管理中心</text>
  <line x1="50" y1="602" x2="50" y2="628" stroke="#FFE0B2" stroke-width="2"/>

  <!-- L8 -->
  <circle cx="50" cy="650" r="22" fill="#FF8F00"/>
  <text x="50" y="655" text-anchor="middle" font-size="14" font-weight="700" fill="white">8</text>
  <rect x="82" y="632" width="260" height="36" rx="10" fill="white" filter="url(#shadow)"/>
  <text x="92" y="654" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#FF8F00">🏫 学校资助工作领导小组</text>
  <line x1="50" y1="672" x2="50" y2="698" stroke="#FFCC80" stroke-width="2"/>

  <!-- L9: President's Office (top) -->
  <circle cx="50" cy="730" r="28" fill="url(#goldGrad)"/>
  <text x="50" y="736" text-anchor="middle" font-size="16" font-weight="700" fill="white">9</text>
  <rect x="92" y="710" width="260" height="44" rx="12" fill="white" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
  <text x="102" y="730" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#E65100">⚖️ 校长办公会</text>
  <text x="102" y="746" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#999">最高决策 · 三重一大终审</text>

  <!-- Bottom indicator -->
  <rect x="130" y="790" width="120" height="24" rx="12" fill="#E8EAF6"/>
  <text x="190" y="807" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#5C6BC0">自下而上逐级审批</text>

  <!-- Arrows between levels -->
  <polygon points="90,145 82,155 98,155" fill="#BBDEFB"/>
  <polygon points="90,215 82,225 98,225" fill="#BBDEFB"/>
  <polygon points="90,285 82,295 98,295" fill="#BBDEFB"/>
  <polygon points="90,355 82,365 98,365" fill="#BBDEFB"/>
  <polygon points="90,425 82,435 98,435" fill="#BBDEFB"/>
  <polygon points="90,495 82,505 98,505" fill="#FFE0B2"/>
  <polygon points="90,625 82,635 98,635" fill="#FFE0B2"/>
  <polygon points="90,695 82,705 98,705" fill="#FFCC80"/>
</svg>
